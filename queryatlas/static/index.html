<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueryAtlas · 数据管理控制台</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <header>
      <b class="brand">Query<span>Atlas</span></b
      ><span class="divider">数据管理控制台</span><span id="identity"></span
      ><button id="logout" hidden>退出</button>
    </header>
    <main id="login">
      <form id="loginForm" class="card login">
        <h1>登录工作空间</h1>
        <label
          >访问密钥<input
            name="token"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button class="primary">进入控制台</button>
      </form>
    </main>
    <div id="shell" hidden>
      <aside>
        <label>当前空间<select id="space"></select></label>
        <nav id="nav"></nav>
      </aside>
      <main>
        <div class="top">
          <h1 id="title"></h1>
          <button id="refresh">刷新</button>
        </div>
        <div id="view"></div>
      </main>
    </div>
    <p id="message" role="status" hidden></p>
  </body>
</html>
